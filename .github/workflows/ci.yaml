name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate HTML
        run: npx --yes html-validate@11.16.2 index.html

      - name: Syntax-check app modules
        run: node scripts/check-app-js.mjs
