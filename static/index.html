<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebAcidizator</title>
  <style>
    :root {
      color-scheme: dark;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #1e293b, #0b1324 65%);
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #e2e8f0;
    }

    #container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }

    #app {
      width: min(90vmin, 900px);
      height: min(90vmin, 900px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      border-radius: 20px;
      box-shadow: 0 25px 60px rgba(15, 23, 42, 0.6);
      max-width: 100%;
      max-height: 100%;
    }

    video {
      display: none;
    }

    .controls {
      display: flex;
      gap: 1rem;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }

    button {
      padding: 0.875rem 2rem;
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
    }

    button:active:not(:disabled) {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    #captureBtn::before {
      content: "📸";
      font-size: 1.2rem;
    }

    #switchCameraBtn::before {
      content: "🔄";
      font-size: 1.2rem;
    }

    .flash {
      position: fixed;
      inset: 0;
      background: white;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.1s ease;
    }

    .flash.active {
      opacity: 0.8;
    }

    .error {
      text-align: center;
      padding: 1.5rem 2rem;
      border-radius: 18px;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      max-width: 420px;
      line-height: 1.5;
    }

    .error strong {
      display: block;
      margin-bottom: 0.5rem;
      font-size: 1.125rem;
    }

    .status {
      font-size: 0.875rem;
      color: #94a3b8;
      text-align: center;
      min-height: 1.25rem;
    }
  </style>
</head>
<body>
  <div id="container">
    <div id="app"></div>
    <div class="controls">
      <button id="captureBtn" disabled>Capture Photo</button>
      <button id="switchCameraBtn" disabled style="display: none;">Switch Camera</button>
    </div>
    <div class="status" id="status"></div>
  </div>
  <video id="webcam" autoplay playsinline muted></video>
  <div class="flash" id="flash"></div>

  <script type="module">
    import {
      Application,
      Sprite,
      Texture,
      ColorMatrixFilter,
      NoiseFilter,
      Filter,
      GlProgram
    } from "https://cdn.jsdelivr.net/npm/pixi.js@8/dist/pixi.min.mjs";

    // ============================================================================
    // Configuration
    // ============================================================================

    const CONFIG = {
      FPS: 15,
      SCALE_FACTOR: 1,
      NOISE_AMOUNT: 0.22,
      PARAM_CHANGE_INTERVAL: 60,
      PIXEL_SORT: {
        MIN_THRESHOLD_RANGE: [0.1, 0.3],
        MAX_THRESHOLD_RANGE: [0.5, 1.0],
        SPREAD_RANGE: [15, 65]
      },
      DELAYS: {
        CLEANUP: 100,
        STREAM_STABILITY: 200,
        FLASH_DURATION: 100,
        STATUS_MESSAGE: 2000,
        ERROR_MESSAGE: 3000,
        URL_REVOKE: 100
      }
    };

    const ERROR_MESSAGES = {
      NotAllowedError: "Camera permission denied",
      NotFoundError: "No camera found",
      NotReadableError: "Camera already in use",
      OverconstrainedError: "Requested camera not available"
    };

    const STARTUP_ERROR_MESSAGES = {
      NotAllowedError: "Please allow camera access and refresh the page.",
      NotFoundError: "No camera found on your device.",
      NotReadableError: "Camera is already in use by another application."
    };

    // ============================================================================
    // GLSL Shaders
    // ============================================================================

    const SHADERS = {
      vertex: `
precision highp float;

in vec2 aPosition;
out vec2 vTextureCoord;
uniform vec4 uInputSize;
uniform vec4 uOutputFrame;
uniform vec4 uOutputTexture;

vec4 filterVertexPosition(void) {
  vec2 position = aPosition * uOutputFrame.zw + uOutputFrame.xy;
  position.x = position.x * (2.0 / uOutputTexture.x) - 1.0;
  position.y = position.y * (2.0 * uOutputTexture.z / uOutputTexture.y) - uOutputTexture.z;
  return vec4(position, 0.0, 1.0);
}

vec2 filterTextureCoord(void) {
  return aPosition * (uOutputFrame.zw * uInputSize.zw);
}

void main(void) {
  gl_Position = filterVertexPosition();
  vTextureCoord = filterTextureCoord();
}`,

      fragment: `
precision highp float;

in vec2 vTextureCoord;
uniform sampler2D uTexture;
uniform vec4 uInputSize;
uniform float uMinThreshold;
uniform float uMaxThreshold;
uniform float uSpread;

float luminance(vec3 color) {
  return dot(color, vec3(0.2126, 0.7152, 0.0722));
}

void main(void) {
  vec2 uv = vTextureCoord;
  vec4 base = texture(uTexture, uv);
  float baseLuma = luminance(base.rgb);

  if (baseLuma < uMinThreshold || baseLuma > uMaxThreshold) {
    gl_FragColor = base;
    return;
  }

  vec2 texelSize = vec2(1.0) / uInputSize.xy;
  float spreadClamped = clamp(uSpread, 1.0, 64.0);
  int steps = int(spreadClamped);

  vec4 brightest = base;
  float brightestLuma = baseLuma;
  vec4 darkest = base;
  float darkestLuma = baseLuma;

  for (int i = 1; i <= 64; i++) {
    if (i > steps) break;

    float offset = float(i) * texelSize.y;

    vec2 downUv = uv + vec2(0.0, offset);
    if (downUv.y <= 1.0) {
      vec4 sample = texture(uTexture, downUv);
      float luma = luminance(sample.rgb);
      if (luma >= uMinThreshold && luma <= uMaxThreshold && luma > brightestLuma) {
        brightest = sample;
        brightestLuma = luma;
      }
    }

    vec2 upUv = uv - vec2(0.0, offset);
    if (upUv.y >= 0.0) {
      vec4 sample = texture(uTexture, upUv);
      float luma = luminance(sample.rgb);
      if (luma >= uMinThreshold && luma <= uMaxThreshold && luma < darkestLuma) {
        darkest = sample;
        darkestLuma = luma;
      }
    }
  }

  float mixFactor = smoothstep(uMinThreshold, uMaxThreshold, baseLuma);
  gl_FragColor = mix(darkest, brightest, mixFactor);
}`
    };

    // ============================================================================
    // DOM Elements
    // ============================================================================

    const DOM = {
      container: document.getElementById("app"),
      webcam: document.getElementById("webcam"),
      captureBtn: document.getElementById("captureBtn"),
      switchCameraBtn: document.getElementById("switchCameraBtn"),
      flash: document.getElementById("flash"),
      status: document.getElementById("status")
    };

    // ============================================================================
    // Application State
    // ============================================================================

    const state = {
      currentStream: null,
      availableCameras: [],
      currentCameraIndex: 0,
      app: null,
      sprite: null,
      texture: null,
      colorMatrix: null,
      noiseFilter: null,
      pixelSortFilter: null,
      resizeHandler: null
    };

    // ============================================================================
    // Utility Functions
    // ============================================================================

    const showError = (message) => {
      DOM.container.innerHTML = `
        <div class="error">
          <strong>Camera Access Needed</strong>
          <span>${message}</span>
        </div>
      `;
    };

    const randomInRange = (min, max) => min + Math.random() * (max - min);

    const setStatus = (message, duration = 0) => {
      DOM.status.textContent = message;
      if (duration > 0) {
        setTimeout(() => { DOM.status.textContent = ''; }, duration);
      }
    };

    const delay = (ms) => new Promise(resolve => setTimeout(resolve, ms));

    // ============================================================================
    // Filter Creation
    // ============================================================================

    const createColorMatrix = () => {
      const filter = new ColorMatrixFilter();
      // Remove green channel for cyan/magenta color scheme
      filter.matrix = [
        1, 0, 0, 0, 0,  // Red
        0, 0, 0, 0, 0,  // Green (disabled)
        0, 0, 1, 0, 0,  // Blue
        0, 0, 0, 1, 0   // Alpha
      ];
      return filter;
    };

    const createPixelSortFilter = () => {
      return new Filter({
        glProgram: new GlProgram({
          fragment: SHADERS.fragment,
          vertex: SHADERS.vertex,
        }),
        resources: {
          pixelSortUniforms: {
            uMinThreshold: { value: 0.2, type: 'f32' },
            uMaxThreshold: { value: 0.7, type: 'f32' },
            uSpread: { value: 30.0, type: 'f32' },
          }
        },
      });
    };

    const randomizePixelSortParams = (filter) => {
      if (!filter?.uniforms) return;

      const { MIN_THRESHOLD_RANGE, MAX_THRESHOLD_RANGE, SPREAD_RANGE } = CONFIG.PIXEL_SORT;
      filter.uniforms.uMinThreshold = randomInRange(...MIN_THRESHOLD_RANGE);
      filter.uniforms.uMaxThreshold = randomInRange(...MAX_THRESHOLD_RANGE);
      filter.uniforms.uSpread = randomInRange(...SPREAD_RANGE);
    };

    // ============================================================================
    // Photo Capture
    // ============================================================================

    const playFlashEffect = () => {
      DOM.flash.classList.add('active');
      setTimeout(() => DOM.flash.classList.remove('active'), CONFIG.DELAYS.FLASH_DURATION);
    };

    const capturePhoto = () => {
      try {
        playFlashEffect();

        state.app.canvas.toBlob((blob) => {
          if (!blob) {
            setStatus('❌ Failed to capture image');
            return;
          }

          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          const timestamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, -5);

          link.download = `webacidizator-${timestamp}.png`;
          link.href = url;
          link.click();

          setTimeout(() => URL.revokeObjectURL(url), CONFIG.DELAYS.URL_REVOKE);
          setStatus('✅ Photo saved!', CONFIG.DELAYS.ERROR_MESSAGE);
        }, 'image/png');
      } catch (error) {
        console.error('Capture failed:', error);
        setStatus('❌ Capture failed', CONFIG.DELAYS.ERROR_MESSAGE);
      }
    };

    // ============================================================================
    // Camera Management
    // ============================================================================

    const stopStream = () => {
      if (state.currentStream) {
        state.currentStream.getTracks().forEach(track => track.stop());
        state.currentStream = null;
      }
    };

    const getCameraStream = async (deviceId = null) => {
      const constraints = {
        video: deviceId ? { deviceId: { exact: deviceId } } : true,
        audio: false
      };
      return await navigator.mediaDevices.getUserMedia(constraints);
    };

    const getAvailableCameras = async () => {
      try {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const videoDevices = devices.filter(device => device.kind === 'videoinput');
        const cameraInfo = [];

        for (let i = 0; i < videoDevices.length; i++) {
          try {
            const stream = await getCameraStream(videoDevices[i].deviceId);
            const track = stream.getVideoTracks()[0];
            const settings = track.getSettings();

            cameraInfo.push({
              deviceId: videoDevices[i].deviceId,
              label: videoDevices[i].label || `Camera ${i + 1}`,
              facingMode: settings.facingMode || 'undefined'
            });

            stream.getTracks().forEach(t => t.stop());
          } catch (error) {
            console.warn(`Could not probe camera ${i}:`, error);
          }
        }

        return cameraInfo;
      } catch (error) {
        console.error('Failed to enumerate cameras:', error);
        return [];
      }
    };

    const checkMultipleCameras = async () => {
      try {
        state.availableCameras = await getAvailableCameras();

        if (state.currentStream) {
          const currentTrack = state.currentStream.getVideoTracks()[0];
          const currentSettings = currentTrack.getSettings();
          state.currentCameraIndex = state.availableCameras.findIndex(
            cam => cam.deviceId === currentSettings.deviceId
          );
          if (state.currentCameraIndex === -1) state.currentCameraIndex = 0;
        }

        DOM.switchCameraBtn.style.display = state.availableCameras.length > 1 ? 'flex' : 'none';
      } catch (error) {
        console.error("Failed to check cameras:", error);
        DOM.switchCameraBtn.style.display = 'none';
      }
    };

    // ============================================================================
    // Rendering & Texture Management
    // ============================================================================

    const createResizeHandler = () => {
      return () => {
        if (!state.sprite || !state.app) return;

        const { width, height } = state.app.renderer;
        state.sprite.position.set(width / 2, height / 2);

        const videoWidth = DOM.webcam.videoWidth || 640;
        const videoHeight = DOM.webcam.videoHeight || 480;
        const videoAspect = videoWidth / videoHeight;
        const viewAspect = width / height;

        if (viewAspect > videoAspect) {
          state.sprite.width = width * CONFIG.SCALE_FACTOR;
          state.sprite.height = state.sprite.width / videoAspect;
        } else {
          state.sprite.height = height * CONFIG.SCALE_FACTOR;
          state.sprite.width = state.sprite.height * videoAspect;
        }
      };
    };

    const updateVideoTexture = async () => {
      try {
        // Pause video to stop PixiJS event handlers
        DOM.webcam.pause();
        state.app.ticker.stop();

        await delay(CONFIG.DELAYS.CLEANUP);

        // Cleanup old resources
        if (state.texture) {
          state.texture.destroy(true);
          state.texture = null;
        }

        if (state.sprite) {
          if (state.app.stage.children.includes(state.sprite)) {
            state.app.stage.removeChild(state.sprite);
          }
          state.sprite.destroy({ children: true });
          state.sprite = null;
        }

        state.app.renderer.clear();

        // Resume video with new stream
        await DOM.webcam.play();

        // Wait for video ready state
        if (DOM.webcam.readyState < 3) {
          await new Promise((resolve) => {
            DOM.webcam.addEventListener('canplay', resolve, { once: true });
          });
        }

        await delay(CONFIG.DELAYS.STREAM_STABILITY);

        // Create fresh texture and sprite
        state.texture = Texture.from(DOM.webcam);
        state.sprite = new Sprite(state.texture);
        state.sprite.anchor.set(0.5);
        state.sprite.filters = [state.colorMatrix, state.noiseFilter, state.pixelSortFilter];
        state.app.stage.addChild(state.sprite);

        // Resize and render
        if (state.resizeHandler) {
          state.resizeHandler();
        }

        state.app.renderer.render(state.app.stage);
        state.app.ticker.start();
      } catch (error) {
        console.error('Failed to update video texture:', error);
        if (state.app?.ticker) {
          state.app.ticker.start();
        }
        throw error;
      }
    };

    const switchCamera = async () => {
      try {
        DOM.switchCameraBtn.disabled = true;
        DOM.captureBtn.disabled = true;
        setStatus('🔄 Switching camera...');

        state.currentCameraIndex = (state.currentCameraIndex + 1) % state.availableCameras.length;
        const nextCamera = state.availableCameras[state.currentCameraIndex];

        stopStream();

        const stream = await getCameraStream(nextCamera.deviceId);
        state.currentStream = stream;
        DOM.webcam.srcObject = stream;

        await updateVideoTexture();

        setStatus(`✅ ${nextCamera.label}`, CONFIG.DELAYS.STATUS_MESSAGE);
      } catch (error) {
        console.error("Camera switch failed:", error);
        const message = ERROR_MESSAGES[error.name] || "Camera switch failed";
        setStatus(`❌ ${message}`, CONFIG.DELAYS.ERROR_MESSAGE);
      } finally {
        DOM.switchCameraBtn.disabled = false;
        DOM.captureBtn.disabled = false;
      }
    };

    // ============================================================================
    // Application Initialization
    // ============================================================================

    const initializePixiJS = async () => {
      state.app = new Application();
      await state.app.init({
        resizeTo: DOM.container,
        backgroundAlpha: 0,
        antialias: true,
        preserveDrawingBuffer: true
      });
      state.app.ticker.maxFPS = CONFIG.FPS;
      DOM.container.replaceChildren(state.app.canvas);
    };

    const createFilters = () => {
      state.colorMatrix = createColorMatrix();
      state.noiseFilter = new NoiseFilter({ noise: CONFIG.NOISE_AMOUNT });
      state.pixelSortFilter = createPixelSortFilter();
    };

    const setupSprite = () => {
      state.texture = Texture.from(DOM.webcam);
      state.sprite = new Sprite(state.texture);
      state.sprite.anchor.set(0.5);
      state.sprite.filters = [state.colorMatrix, state.noiseFilter, state.pixelSortFilter];
      state.app.stage.addChild(state.sprite);
    };

    const setupEventListeners = () => {
      DOM.captureBtn.addEventListener('click', capturePhoto);
      DOM.switchCameraBtn.addEventListener('click', switchCamera);

      state.resizeHandler = createResizeHandler();

      if (DOM.webcam.readyState >= 1) {
        state.resizeHandler();
      } else {
        DOM.webcam.addEventListener("loadedmetadata", state.resizeHandler, { once: true });
      }

      window.addEventListener("resize", state.resizeHandler);
      window.addEventListener('beforeunload', () => {
        stopStream();
        if (state.texture) {
          state.texture.destroy(true);
        }
      });
    };

    const setupAnimationLoop = () => {
      let frameCount = 0;

      state.app.ticker.add(() => {
        if (DOM.webcam.readyState >= 2 && state.texture?.source) {
          state.texture.source.update();
        }

        state.noiseFilter.seed = Math.random();

        frameCount++;
        if (frameCount % CONFIG.PARAM_CHANGE_INTERVAL === 0) {
          randomizePixelSortParams(state.pixelSortFilter);
        }
      });
    };

    const start = async () => {
      try {
        // Initialize webcam
        const stream = await getCameraStream();
        state.currentStream = stream;
        DOM.webcam.srcObject = stream;
        await DOM.webcam.play();

        // Check for multiple cameras
        await checkMultipleCameras();

        // Initialize PixiJS
        await initializePixiJS();

        // Create filters and sprite
        createFilters();
        setupSprite();

        // Enable controls
        DOM.captureBtn.disabled = false;
        DOM.switchCameraBtn.disabled = false;

        // Setup event listeners
        setupEventListeners();

        // Start animation loop
        setupAnimationLoop();
      } catch (error) {
        console.error("Unable to start webcam:", error);
        const hint = STARTUP_ERROR_MESSAGES[error.name] ||
          "We couldn't access your camera. Please check your browser settings.";
        showError(hint);
      }
    };

    // ============================================================================
    // Application Entry Point
    // ============================================================================

    if (!navigator.mediaDevices?.getUserMedia) {
      showError("Your browser doesn't support camera access via getUserMedia.");
    } else {
      start();
    }
  </script>
</body>
</html>
