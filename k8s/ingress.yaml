apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: webacidizator
  namespace: webacidizator
  labels:
    app: webacidizator
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - webacidizator.yourdomain.com
    secretName: webacidizator-tls
  rules:
  - host: webacidizator.yourdomain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: webacidizator
            port:
              number: 80
